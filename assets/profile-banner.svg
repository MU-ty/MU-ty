<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480" role="img" aria-labelledby="title desc">
<title id="title">MU-ty — Building ideas into reality</title>
<desc id="desc">Dark midnight banner with cyan and violet orbital lines. Wanwu, TRAE Fellow, exploring frontend and AI agents in Guilin and Nanning.</desc>
