 <text x="66" y="201" fill="#f3f4ff" font-size="106" font-weight="750" letter-spacing="-6">MU-ty<tspan fill="#65e6e0">.</tspan></text>
 <text x="72" y="263" fill="#f3f4ff" font-size="31" font-weight="600">Building ideas into reality.</text>
 <text x="72" y="303" fill="#a5adc7" font-size="18">Exploring frontend, AI agents &amp; the space between.</text>
