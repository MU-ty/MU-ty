 <radialGradient id="glow"><stop stop-color="#7161d8" stop-opacity=".25"/><stop offset="1" stop-color="#7161d8" stop-opacity="0"/></radialGradient>
 <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#b4b9ef" stroke-opacity=".045"/></pattern>
</defs>
<rect width="1280" height="480" rx="24" fill="url(#bg)"/>
